<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta property="og:title" content="Для тебя">
<meta property="og:description" content="Открой, это тебе">
<meta name="theme-color" content="#1a0718">
<title>Улыбка</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@800&family=Marck+Script&display=swap">
<link rel="stylesheet" href="kit.css">
<style>
  :root { --bg: #1a0718; --ink: #ffe6f1; --glow: rgba(255, 126, 182, 0.55); --muted: #b07c98; }
</style>

<canvas id="scene" aria-label="Светящаяся улыбка, вокруг которой всё быстрее кружится вихрь огоньков"></canvas>
<div id="say"><span>Софа,</span><h1>твоя улыбка сводит меня с ума</h1></div>
<p id="hint">коснись экрана</p>

<script src="kit.js"></script>
<script>
(function () {
  var ps = [], boost = 0, cols = ['#ff7eb6', '#ffd27a', '#ffffff', '#c79bff'];

  play({
    sayAt: 6, hintAt: 14, endAt: 30,
    init: function () {
      ps = [];
      for (var i = 0; i < 170; i++) {
        ps.push({ rad: 0.5 + Math.random() * 0.6, ang: Math.random() * 6.283, w: 0.7 + Math.random() * 1.3, c: cols[i % 4], sp: 0.5 + Math.random() });
      }
    },
    draw: function (c, S) {
      var t = S.t, u = Math.min(S.W * 0.44, S.H * 0.27), R = u * 0.4;
      var fx = S.cx, fy = S.H * 0.56;
      var spin = 0.25 + 2.4 * K.prog(t, 3.5, 9) + boost;
      boost *= Math.pow(0.3, S.dt);
      var appear = K.prog(t, 2.6, 3);

      // вихрь
      c.save();
      c.translate(fx, fy + R * 0.35);
      c.rotate(Math.sin(t * 0.9) * 0.05 * Math.min(spin, 3));
      c.scale(1, 0.86);
      c.globalCompositeOperation = 'lighter';
      c.lineCap = 'round';
      for (var i = 0; i < ps.length; i++) {
        var P = ps[i];
        P.ang += S.dt * spin * P.sp * (0.35 + 0.5 / P.rad);
        var rr = P.rad * u * (1 + 0.06 * Math.sin(t * 1.3 + P.rad * 9));
        var tail = Math.min(1.3, 0.06 + 0.16 * spin / P.rad);
        c.globalAlpha = appear * (0.3 + 0.5 * (1.1 - P.rad));
        c.strokeStyle = P.c; c.lineWidth = P.w;
        c.beginPath(); c.arc(0, 0, rr, P.ang - tail, P.ang); c.stroke();
        c.globalAlpha = appear;
        c.fillStyle = P.c;
        c.beginPath(); c.arc(Math.cos(P.ang) * rr, Math.sin(P.ang) * rr, P.w * 1.1, 0, 6.283); c.fill();
      }
      c.restore();

      // улыбка
      var p1 = K.prog(t, 0.8, 2.2), eyes = K.prog(t, 2.4, 1);
      c.strokeStyle = '#ff7eb6'; c.shadowColor = '#ff7eb6'; c.shadowBlur = 22;
      c.lineCap = 'round'; c.lineWidth = Math.max(4, u * 0.035);
      if (p1 > 0) {
        c.beginPath();
        c.arc(fx, fy, R, Math.PI * 0.14, Math.PI * (0.14 + 0.72 * p1));
        c.stroke();
      }
      if (eyes > 0) {
        c.globalAlpha = eyes;
        c.lineWidth = Math.max(3, u * 0.028);
        c.beginPath(); c.arc(fx - R * 0.5, fy - R * 0.05, R * 0.17, Math.PI * 1.15, Math.PI * 1.85); c.stroke();
        c.beginPath(); c.arc(fx + R * 0.5, fy - R * 0.05, R * 0.17, Math.PI * 1.15, Math.PI * 1.85); c.stroke();
      }
    },
    tap: function (S, x, y) {
      boost = 3.5;
      K.burst(x, y, 16, { col: ['#ff7eb6', '#ffb3d1', '#ffd27a'], shape: 'heart', power: 200, grav: -30, size: 2.6 });
    }
  });
})();
</script>
