<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta property="og:title" content="Для тебя">
<meta property="og:description" content="Открой, это тебе">
<meta name="theme-color" content="#0b0a1e">
<title>Случайность</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@800&family=Marck+Script&display=swap">
<link rel="stylesheet" href="kit.css">
<style>
  :root { --bg: #0b0a1e; --ink: #f6eed9; --glow: rgba(255, 210, 122, 0.5); --muted: #9b93b8; }
</style>

<canvas id="scene" aria-label="Среди множества случайных точек две золотые находят друг друга"></canvas>
<div id="say"><span>Софа,</span><h1>из всех случайностей в моей жизни эта мне нравится больше всего</h1></div>
<p id="hint">коснись экрана</p>

<script src="kit.js"></script>
<script>
(function () {
  var dots = [], A = { k: 0.4, sign: 1, tr: [] }, B = { k: 2.9, sign: -1, tr: [] }, M = { x: 0, y: 0 }, flash = -1;

  function hero(c, S, h, p, u) {
    var t = S.t;
    var fx = h.sx + Math.sin(t * 1.3 + h.k) * u * 0.16 + Math.sin(t * 0.7 + h.k * 2) * u * 0.1;
    var fy = h.sy + Math.cos(t * 1.1 + h.k) * u * 0.13;
    var ox = M.x + h.sign * Math.cos(t * 1.6) * u * 0.055, oy = M.y + h.sign * Math.sin(t * 1.6) * u * 0.055;
    var x = K.lerp(fx, ox, p), y = K.lerp(fy, oy, p);
    h.tr.push([x, y]);
    if (h.tr.length > 46) h.tr.shift();
    c.lineWidth = 2; c.lineCap = 'round';
    for (var i = 1; i < h.tr.length; i++) {
      c.strokeStyle = 'rgba(255,210,122,' + (i / h.tr.length * 0.6).toFixed(3) + ')';
      c.beginPath(); c.moveTo(h.tr[i - 1][0], h.tr[i - 1][1]); c.lineTo(h.tr[i][0], h.tr[i][1]); c.stroke();
    }
    var g = c.createRadialGradient(x, y, 0, x, y, 20);
    g.addColorStop(0, 'rgba(255,210,122,0.75)'); g.addColorStop(1, 'rgba(255,210,122,0)');
    c.fillStyle = g; c.fillRect(x - 20, y - 20, 40, 40);
    c.fillStyle = '#fff6da';
    c.beginPath(); c.arc(x, y, 4.2, 0, 6.283); c.fill();
  }

  play({
    sayAt: 9.5, hintAt: 17, endAt: 30,
    init: function (S) {
      dots = [];
      for (var i = 0; i < 90; i++) {
        dots.push({ x: Math.random() * S.W, y: Math.random() * S.H, vx: (Math.random() - 0.5) * 20, vy: (Math.random() - 0.5) * 20, r: 0.8 + Math.random() * 1.6, ph: Math.random() * 6.28 });
      }
      M.x = S.cx; M.y = S.H * 0.64;
      A.sx = S.W * 0.2; A.sy = S.H * 0.46; A.tr = [];
      B.sx = S.W * 0.8; B.sy = S.H * 0.84; B.tr = [];
    },
    draw: function (c, S) {
      var t = S.t, u = Math.min(S.W, S.H), p = K.prog(t, 2.5, 8.5), i, j, d;

      for (i = 0; i < dots.length; i++) {
        d = dots[i];
        d.vx = (d.vx + (Math.random() - 0.5) * 60 * S.dt) * 0.985;
        d.vy = (d.vy + (Math.random() - 0.5) * 60 * S.dt) * 0.985;
        d.x += d.vx * S.dt; d.y += d.vy * S.dt;
        if (d.x < -5) d.x = S.W + 5; if (d.x > S.W + 5) d.x = -5;
        if (d.y < -5) d.y = S.H + 5; if (d.y > S.H + 5) d.y = -5;
      }
      // случайные связи между близкими точками
      c.lineWidth = 1;
      for (i = 0; i < dots.length; i++) {
        for (j = i + 1; j < dots.length; j++) {
          var dx = dots[i].x - dots[j].x, dy = dots[i].y - dots[j].y, q = dx * dx + dy * dy;
          if (q < 4900) {
            c.strokeStyle = 'rgba(154,160,216,' + ((1 - Math.sqrt(q) / 70) * 0.22).toFixed(3) + ')';
            c.beginPath(); c.moveTo(dots[i].x, dots[i].y); c.lineTo(dots[j].x, dots[j].y); c.stroke();
          }
        }
      }
      for (i = 0; i < dots.length; i++) {
        d = dots[i];
        c.fillStyle = 'rgba(190,196,255,' + (0.35 + 0.3 * Math.sin(t * 1.5 + d.ph)).toFixed(3) + ')';
        c.beginPath(); c.arc(d.x, d.y, d.r, 0, 6.283); c.fill();
      }

      if (p >= 1 && flash < 0) {
        flash = t;
        if (!S.calm) K.burst(M.x, M.y, 40, { col: '#ffd27a', shape: 'star', power: 240 });
      }
      if (flash >= 0) {
        var f = t - flash;
        c.globalCompositeOperation = 'lighter';
        var halo = c.createRadialGradient(M.x, M.y, 0, M.x, M.y, u * 0.42);
        halo.addColorStop(0, 'rgba(255,210,122,' + (0.26 + 0.08 * Math.sin(t * 2)).toFixed(3) + ')');
        halo.addColorStop(1, 'rgba(255,210,122,0)');
        c.fillStyle = halo; c.fillRect(0, 0, S.W, S.H);
        for (i = 0; i < dots.length; i++) {
          var mx = dots[i].x - M.x, my = dots[i].y - M.y, md = Math.sqrt(mx * mx + my * my);
          if (md < u * 0.36) {
            c.strokeStyle = 'rgba(255,210,122,' + ((1 - md / (u * 0.36)) * 0.3).toFixed(3) + ')';
            c.beginPath(); c.moveTo(M.x, M.y); c.lineTo(dots[i].x, dots[i].y); c.stroke();
          }
        }
        if (f < 1.4) {
          c.strokeStyle = 'rgba(255,236,190,' + (1 - f / 1.4).toFixed(3) + ')';
          c.lineWidth = 2;
          c.beginPath(); c.arc(M.x, M.y, f * u * 0.5, 0, 6.283); c.stroke();
        }
        c.globalCompositeOperation = 'source-over';
      }
      hero(c, S, A, p, u);
      hero(c, S, B, p, u);
    },
    tap: function (S, x, y) {
      K.burst(x, y, 18, { col: '#ffd27a', shape: 'star', power: 200 });
      for (var i = 0; i < dots.length; i++) {
        var dx = dots[i].x - x, dy = dots[i].y - y, d = Math.sqrt(dx * dx + dy * dy) || 1;
        if (d < 130) { dots[i].vx += dx / d * 160; dots[i].vy += dy / d * 160; }
      }
    }
  });
})();
</script>
